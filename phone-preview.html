<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aperçu téléphone — SoukPrix</title>
<style>
  :root{
    --bg:#efe9dd;
    --ink:#2a2118;
    --ink-soft:#786a56;
    --accent:#c1552b;
    --surface:#fff;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
    padding:28px 16px 60px; gap:18px;
  }
  h1{ font-size:1.1rem; margin:0; font-weight:600; }
  .toolbar{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; justify-content:center; }
  .btn{
    background:var(--accent); color:#fff8f0; border:none; border-radius:999px; padding:9px 18px;
    font-size:0.85rem; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{ transform:scale(0.97); }
  .toggle-row{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--ink-soft); }
  .toggle-row input{ width:16px; height:16px; }
  select{
    border:1px solid #d8caae; border-radius:999px; padding:8px 14px; font-size:0.85rem; background:#fff; color:var(--ink);
  }
  .status{ font-size:0.75rem; color:var(--ink-soft); font-variant-numeric:tabular-nums; }

  .phone{
    position:relative;
    width:390px; height:844px;
    background:#111;
    border-radius:52px;
    padding:14px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.45), 0 0 0 2px #000;
    flex-shrink:0;
  }
  .phone.tablet{ width:820px; height:1120px; border-radius:36px; padding:20px; }
  .screen{
    position:relative; width:100%; height:100%; background:#fff; border-radius:38px; overflow:hidden;
  }
  .phone.tablet .screen{ border-radius:22px; }
  .notch{
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:120px; height:28px; background:#111; border-radius:20px; z-index:5;
  }
  .phone.tablet .notch{ display:none; }
  iframe{ width:100%; height:100%; border:none; display:block; background:#fff; }
  .home-indicator{
    position:absolute; bottom:8px; left:50%; transform:translateX(-50%);
    width:120px; height:5px; background:#111; border-radius:999px; z-index:5;
  }

  @media (max-width:460px){
    .phone{ transform:scale(0.82); transform-origin:top center; margin-bottom:-150px; }
  }
</style>
</head>
<body>
  <h1>📱 Aperçu en direct — SoukPrix</h1>
  <div class="toolbar">
    <button class="btn" id="refreshBtn" type="button">🔄 Rafraîchir maintenant</button>
    <label class="toggle-row"><input type="checkbox" id="autoToggle" checked> Actualisation auto</label>
    <select id="intervalSelect">
      <option value="1500" selected>toutes les 1,5s</option>
      <option value="3000">toutes les 3s</option>
      <option value="5000">toutes les 5s</option>
    </select>
    <select id="deviceSelect">
      <option value="phone" selected>📱 Téléphone</option>
      <option value="tablet">📱 Tablette</option>
    </select>
    <span class="status" id="statusText"></span>
  </div>

  <div class="phone" id="phoneFrame">
    <div class="notch"></div>
    <div class="screen">
      <iframe id="previewFrame" src="index.html"></iframe>
    </div>
    <div class="home-indicator"></div>
  </div>

<script>
  var frame = document.getElementById("previewFrame");
  var statusText = document.getElementById("statusText");
  var timer = null;

  function doRefresh(){
    frame.src = "index.html?t=" + Date.now();
    statusText.textContent = "Actualisé à " + new Date().toLocaleTimeString("fr-FR");
  }

  function startAuto(){
    stopAuto();
    var ms = parseInt(document.getElementById("intervalSelect").value, 10);
    timer = setInterval(doRefresh, ms);
  }
  function stopAuto(){
    if(timer){ clearInterval(timer); timer = null; }
  }

  document.getElementById("refreshBtn").addEventListener("click", doRefresh);
  document.getElementById("autoToggle").addEventListener("change", function(e){
    if(e.target.checked) startAuto(); else stopAuto();
  });
  document.getElementById("intervalSelect").addEventListener("change", function(){
    if(document.getElementById("autoToggle").checked) startAuto();
  });
  document.getElementById("deviceSelect").addEventListener("change", function(e){
    document.getElementById("phoneFrame").classList.toggle("tablet", e.target.value==="tablet");
  });

  doRefresh();
  startAuto();
</script>
</body>
</html>
